[project]
name = "netwalker-backend"
version = "0.1.0"
description = "NetWalker: 拠点ネットワーク障害の自律調査・承認付き復旧デモ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "pyyaml>=6.0",
    "pillow>=10.4",
]

[tool.uv]
package = false
